# chorus permission allow-list (chorus-spec.md §5).
#
# Keyed on ACP's standardized ToolCallUpdate.Kind, not per-agent tool names
# (Claude's "Read"/"Bash" vs Gemini's "read_file"/"run_shell_command" aren't
# visible over ACP — Kind is the one thing every agent reports uniformly).
# Valid kinds: read, edit, delete, move, search, execute, think, fetch,
# switch_mode, other.
#
# Anything not listed under auto_allow falls through and asks.
#
# auto_allow_tools matches a tool call's title instead of its kind, for
# chorus's own `delegate` MCP tool (§11): to every agent, an external MCP
# tool's kind is generically "other", so kind-based matching can't single
# it out. delegate calls are cheap to auto-allow — they're not filesystem
# or shell operations — per §11's guardrails.
#
# Matching is a case-insensitive PREFIX, not substring (chorus-spec.md §0's
# 2026-08-22 audit): a substring check would let ANY tool call whose title
# merely *mentions* "delegate" bypass its real permission requirement —
# e.g. an execute-kind Bash call titled "please delegate this" would have
# matched and skipped the prompt regardless of what it actually runs.
# `mcp__chorus-delegate__` is the real MCP-qualified prefix agents were
# observed using live (e.g. "mcp__chorus-delegate__delegate") — much
# harder to spoof by accident or in a casual sentence than the bare word.
claude:
  auto_allow: [read, search, think]
  auto_allow_tools: [mcp__chorus-delegate__]
gemini:
  auto_allow: [read, search, think]
  auto_allow_tools: [mcp__chorus-delegate__]
opencode:
  auto_allow: [read, search, think]
  auto_allow_tools: [mcp__chorus-delegate__]

# chorus-spec.md §9: auto-routing when a prompt has no "<agent>: " prefix.
# v1's router is deliberately keyword-based, not model-based (a classifier
# call would itself burn tokens on a metered agent). First matching rule
# wins; unmatched prompts fall back to `default`.
#
# Matching is whole-word (or whole-phrase), not substring: "fix" won't
# match inside "prefix"/"suffix", "list" won't match inside "checklist" —
# an earlier substring-based version of this router misrouted on exactly
# that (see chorus-spec.md §0 and internal/router's tests).
#
# `default: opencode` (rather than the spec's original `gemini`) reflects
# this environment's reality: opencode works with zero configured
# credentials, gemini is currently blocked on this machine by a Google-side
# tier restriction (see chorus-spec.md §0). Adjust to taste once your own
# agents' availability differs.
routing:
  default: opencode
  ask_when_ambiguous: false
  rules:
    - match: [fix, implement, refactor, debug, architecture, bug, error]
      agent: claude
    - match: [summarize, explain, list, scan, review, analyze]
      agent: gemini

# chorus-spec.md §11 / CLAUDE.md's delegation-maximization plan:
# - briefing: a one-time priming message sent to each agent's session on
#   its first-ever turn, once 2+ agents are connected, explaining the
#   agent roster (agents.yaml's cost_tier/notes) and encouraging
#   proactive use of the delegate tool. On by default — delegation should
#   be a live option the agent reaches for on its own, not something the
#   user has to ask for every time. Uncomment to disable:
# delegation:
#   briefing: false
#
# - prefer / nudge_threshold (item 2 of the plan): when a metered agent
#   (agents.yaml's cost_tier: metered) makes `nudge_threshold` direct tool
#   calls in a row (default 3) whose Kind is listed in `prefer`, AND a
#   non-metered agent is currently connected and idle, chorus prepends a
#   one-time reminder to that agent's next queued prompt suggesting it
#   delegate similar work instead. The counter resets every time the
#   agent actually calls `delegate`. Enabled below (was off by default,
#   empty prefer list, until live use showed the briefing alone — a
#   one-time message at session start — isn't enough on its own: it
#   fades from relevance as a long session goes on, and doesn't push back
#   in the moment an agent is actually about to do mechanical work
#   directly instead of delegating it). threshold: 2 rather than the
#   default 3 — reacts after just two direct calls in a row, since the
#   goal here is agents reaching for `delegate` reliably, not eventually.
delegation:
  prefer: [execute, edit]
  nudge_threshold: 2
